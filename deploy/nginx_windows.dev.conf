# user root; # Windows不支持user指令，注释掉
worker_processes  1;
error_log logs/error.log error;

events {
    worker_connections  1024;
}

http {
    access_log logs/access.log;
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/atom+xml                  atom;
        application/rss+xml                   rss;
        font/ttf                              ttf;
        font/woff                             woff;
        font/woff2                            woff2;
        image/svg+xml                         svg;
        application/json                      json;
    }
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream business_backend {
        server 127.0.0.1:5002;
    }

    upstream inference_backend {
        server 127.0.0.1:8000;
    }

    upstream vite_frontend {
        server 127.0.0.1:${FRONTEND_DEV_PORT};
    }

    server {
        listen       8008;
        server_name  _;

        location /upload {
            rewrite ^/upload$ /api/v2/upload break;
            proxy_pass         http://business_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3600s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
            send_timeout          3600s;
            proxy_buffering       off;
            proxy_request_buffering off;
            client_max_body_size 50M;
        }

        location /api/v2/ {
            proxy_pass         http://business_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3600s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
            send_timeout          3600s;
            proxy_buffering       off;
            proxy_request_buffering off;
            client_max_body_size 50M;
        }

        location /inference/ {
            proxy_pass         http://inference_backend/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3600s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
            send_timeout          3600s;
            proxy_buffering       off;
            proxy_request_buffering off;
        }

        location / {
            proxy_pass         http://vite_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_connect_timeout 3600s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
            proxy_buffering       off;
            proxy_cache_bypass    $http_upgrade;
        }

        location = /healthz {
            return 200 'ok';
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript application/xml+rss;
        gzip_min_length 1000;
    }
}
