user root;
worker_processes  1;
error_log logs/error.log error;

events {
    worker_connections  1024;
}

http {
    # Embed critical mime types to avoid path resolution issues
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/atom+xml                  atom;
        application/rss+xml                   rss;
        font/ttf                              ttf;
        font/woff                             woff;
        font/woff2                            woff2;
        image/svg+xml                         svg;
        application/json                      json;
    }
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    upstream business_backend {
        server 127.0.0.1:5001;
    }

    upstream inference_backend {
        server 127.0.0.1:8000;
    }

    server {
        # 服务监听端口（当前改为 8008）
        listen       8008;
        server_name  _;

        # 前端打包产物目录（启动脚本通过 envsubst 注入）
        root   ${FRONTEND_ROOT};
        index  index.html;

        # 前端 SPA：优先命中文件，其次回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 业务后端（Flask）代理：前端调用 /api/** 自动转发到 5000
        location /api/ {
            proxy_pass         http://business_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 推理后端（FastAPI）可选直通，便于调试或健康检查
        location /inference/ {
            proxy_pass         http://inference_backend/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 基础健康检查
        location = /healthz {
            return 200 'ok';
        }

        # 简单静态资源压缩
        gzip on;
        gzip_types text/plain text/css application/json application/javascript application/xml+rss;
        gzip_min_length 1000;
    }
}
